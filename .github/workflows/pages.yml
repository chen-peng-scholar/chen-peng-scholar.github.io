name: Publish academic profile

on:
  push:
    branches: [main]
    paths:
      - Peng-Chen-Academic-Profile-GitHub.zip
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Extract and check the site
        run: |
          unzip -q Peng-Chen-Academic-Profile-GitHub.zip -d site
          test -s site/index.html
          test -s site/Peng-Chen-CV.pdf
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: deployment
